# Redis Configuration for Autonomous Agent System

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence — append-only file for durability
appendonly yes
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Timeout — close idle connections after 5 minutes
timeout 300

# Keep-alive
tcp-keepalive 60
